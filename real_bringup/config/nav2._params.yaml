controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0                      #how often controller updates
    min_x_velocity_threshold: 0.001                 #tiny vel. below these becomes 0, to prevent tiny floating-point noise
    min_y_velocity_threshold: 0.001     
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    #-----detect stuck robot-------
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2 #must have moved at least this far to be making progress
      movement_time_allowance: 10.0 #time allowed for robot to make progress, else considered stuck
    
    #-----detect if goal reached-------
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25    #m, if within this distance of goal, considered reached
      yaw_goal_tolerance: 0.25   #rads(about 14 degrees) if within this angle of goal, considered reached
      stateful: true

    #----Local planner (controller)-------
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      #according to limited velocities calculated
      min_vel_x:  0.0
      min_vel_y:  0.0
      max_vel_x:  0.3    #max forward speed
      max_vel_y:  0.0    #can't reverse, set to -0.2 if wanted to allow reversing
      max_vel_theta: 1.0 #max rotation speed (rad/sec)

      min_speed_xy:  0.0  
      max_speed_xy:  0.3  #linear speed limit(same as max_vel_x) 
      min_speed_theta: 0.0

      #must match reality, send step velocity and observe time to reach speed, a = Δv / Δt
      acc_lim_x:     2.5
      acc_lim_y:     0.0
      acc_lim_theta: 3.2
      decel_lim_x:  -2.5
      decel_lim_y:   0.0
      decel_lim_theta: -3.2

      vx_samples:   20   #how many samples in x direction (forward)
      vy_samples:   5    #how many samples in y direction
      vtheta_samples: 20 #more samples=better trajectory (more cpu)
      
      sim_time:      1.7 #DWB predicts path this far into the future, in secs
      
      #simulation resolution, smaller=more accurate (more cpu)
      linear_granularity:  0.05
      angular_granularity: 0.025

      xy_goal_tolerance:   0.25 #if within this distance of goal, considered reached (match goal checker)
      yaw_goal_tolerance:  0.25 #if within this angle of goal
      transform_tolerance: 0.3  #how long to wait for a tf to become available before erroring out
      short_circuit_trajectory_evaluation: true
      stateful: true

      #critic_score_threshold: 0.5 #if any trajectory/path has a critic score below this, it will be rejected, even if it's the best one
      critics:
        - "RotateToGoal"   
        - "Oscillation"
        - "BaseObstacle"
        - "GoalAlign"
        - "PathAlign"
        - "PathDist"
        - "GoalDist"

      #rotate properly to face the goal
      RotateToGoal:
        scale: 32.0
        slowing_factor: 5.0
        lookahead_time: -1.0
        
      Oscillation:
        scale: 1.0

      #avoid obstacles, high(more obstacle avoidance), too high (can refuse narrow spaces like doorways), too low (collides with obstacles)
      BaseObstacle:
        scale: 0.02

      #align with the path, high (follows path tightly), too high (oscillation)
      PathAlign:
        scale: 32.0
        forward_point_distance: 0.1

      #align heading toward goal, high (faces goal more directly), too high (oscillation)
      GoalAlign:
        scale: 24.0
        forward_point_distance: 0.1

      #stay close to the path, high (follows path tightly), too high (oscillation)
      PathDist:
        scale: 32.0

      #get to the goal, high (faces goal more directly), too high (oscillation)
      GoalDist:
        scale: 24.0

#------global planner------
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner" #NavfnPlanner supports A* and Dijkstra
      use_astar: true        
                             
      tolerance: 0.5         #allowable distance from goal to still be considered a valid plan
      allow_unknown: false   #false = safe after SLAM, unknown cells treated as occupied
                             

#-----behavior server-----
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic:    local_costmap/costmap_raw 
    global_costmap_topic:   global_costmap/costmap_raw
    local_footprint_topic:  local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    simulate_ahead_time: 2.0  #recovery collision checking

    #must match reality and controller limits
    max_rotational_vel:  1.0
    min_rotational_vel:  0.4
    rotational_acc_lim:  3.2

#-----behavior tree navigator, the main server that ties everything together and runs the behavior tree (brain/state machine)-----
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: CHASSIS
    odom_topic: /odometry/filtered   
    default_server_timeout: 20
    transform_tolerance: 0.5
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

#-----waypoint follower, follows a list of waypoints, good for simple point-to-point navigation-----
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20       #tiny pause between waypoints in Hz, set to 0 for no pause
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200  #milliseconds to wait at each waypoint before moving to next

#----local costmap-----
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency:  5.0
      publish_frequency: 2.0
      global_frame:      odom
      robot_base_frame:  CHASSIS
      rolling_window:    true   #keep robot in center of costmap, good for local costmap
      
      #area around robot, too small(can't see obstacles far enough), too large (wastes Pi 5 cpu)
      width:  4
      height: 4

      #5 cm = 1 cell, smaller=more accurate but more cpu
      resolution: 0.05

      transform_tolerance: 0.5

      #robot collision polygon ,match URDF dimensions
      footprint: "[[0.37, 0.34], [0.37, -0.34], [-0.37, -0.34], [-0.37, 0.34]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]

      #obstacle layer uses lidar data to mark obstacles
      #inflation layer expands obstacles to account for robot size and safety buffer
      obstacle_layer: 
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.5
          min_obstacle_height: 0.05
          clearing: true
          marking: true
          data_type: "LaserScan"

          #RPlidar A1 spec is 8m but reliable real-world range is ~6m
          #raytrace must always be >= obstacle range to correctly clear free space
          raytrace_max_range:  6.0   
          raytrace_min_range:  0.15  

          #obstacle marking range, kept conservative below raytrace range
          obstacle_max_range:  5.5   
          obstacle_min_range:  0.15  

      #inflate obstacles so robot steers away from them
      #reduce toward 0.25 only if robot struggles to pass through tight place
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.40
      always_send_full_costmap: true

#-----global costmap — same as local costmap but covers the whole map-----
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency:  1.0
      publish_frequency: 1.0
      global_frame:      map
      robot_base_frame:  CHASSIS
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.5
      #robot collision polygon (match URDF)
      footprint: "[[0.37, 0.34], [0.37, -0.34], [-0.37, -0.34], [-0.37, 0.34]]"
      footprint_padding: 0.01
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      #loading the static SLAM-built map
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.5
          min_obstacle_height: 0.05
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range:  6.0   
          raytrace_min_range:  0.15  
          obstacle_max_range:  5.5   
          obstacle_min_range:  0.15  

      #global inflation kept larger than local (0.55 vs 0.40):
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true