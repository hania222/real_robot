amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id:   "CHASSIS"
    odom_frame_id:   "odom"
    global_frame_id: "map"
    scan_topic:      "/scan"

    # No set_initial_pose here — set manually in RViz on the real robot

    min_particles:      500
    max_particles:      2000
    update_min_d:       0.2
    update_min_a:       0.5
    resample_interval:  1
    transform_tolerance: 1.0
    laser_model_type:            "likelihood_field"
    laser_max_range:             6.0
    laser_min_range:             0.15
    laser_likelihood_max_dist:   2.0
    max_beams:                   60
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2