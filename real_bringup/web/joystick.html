<!DOCTYPE html>
<html lang="en">
<head>
  <title>Robot Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.js"></script>  <!-- nippleJS library is a ready-made joystick library, cdn.jsdelivr.net/nipplejs is a website that hosts JS libraries for free use -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'SF Mono', 'Fira Code', monospace;
      padding: 24px 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .robot-icon {
      width: 36px; height: 36px;
      background: #00d4aa22;
      border: 1px solid #00d4aa44;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #e6edf3;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .header p {
      font-size: 11px;
      color: #7d8590;
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    .conn-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #161b22;
      border: 0.5px solid #30363d;
      border-radius: 20px;
      padding: 6px 14px;
      margin-bottom: 28px;
      font-size: 12px;
      color: #7d8590;
      transition: all 0.3s;
    }
    .conn-bar.connected { border-color: #00d4aa44; color: #00d4aa; }
    .conn-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #f85149;
      transition: background 0.3s;
    }
    .conn-bar.connected .conn-dot {
      background: #00d4aa;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .joystick-wrap {
      position: relative;
      margin-bottom: 32px;
    }
    .joystick-ring {
      width: 240px; height: 240px;
      border-radius: 50%;
      background: #161b22;
      border: 1.5px solid #30363d;
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .joystick-ring::before {
      content: '';
      position: absolute;
      inset: 16px;
      border-radius: 50%;
      border: 0.5px dashed #21262d;
    }
    .cross-h, .cross-v {
      position: absolute;
      background: #21262d;
    }
    .cross-h { width: 80%; height: 0.5px; top: 50%; left: 10%; }
    .cross-v { height: 80%; width: 0.5px; left: 50%; top: 10%; }
    .dir-label {
      position: absolute;
      font-size: 9px;
      color: #484f58;
      letter-spacing: 0.1em;
      font-weight: 600;
    }
    .dir-label.n { top: 16px; left: 50%; transform: translateX(-50%); }
    .dir-label.s { bottom: 16px; left: 50%; transform: translateX(-50%); }
    .dir-label.w { left: 16px; top: 50%; transform: translateY(-50%); }
    .dir-label.e { right: 16px; top: 50%; transform: translateY(-50%); }
    #zone {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      z-index: 10;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 20px;
    }
    .metric-card {
      background: #161b22;
      border: 0.5px solid #30363d;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .metric-label {
      font-size: 10px;
      color: #7d8590;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .metric-value {
      font-size: 20px;
      font-weight: 600;
      color: #e6edf3;
    }
    .metric-value span {
      font-size: 11px;
      color: #7d8590;
      font-weight: 400;
      margin-left: 3px;
    }
    .metric-bar {
      margin-top: 8px;
      height: 3px;
      background: #21262d;
      border-radius: 2px;
      overflow: hidden;
    }
    .metric-fill {
      height: 100%;
      border-radius: 2px;
      background: #00d4aa;
      width: 0%;
      transition: width 0.1s;
    }
    .metric-fill.angular { background: #58a6ff; }

    .footer {
      font-size: 10px;
      color: #484f58;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>Robot Control</h1>
      <p>SLAM Mapping Mode</p>
    </div>
  </div>

  <div class="conn-bar" id="connBar">
    <div class="conn-dot"></div>
    <span id="connText">Connecting to ws://192.168.1.11:8765</span>
  </div>

  <div class="joystick-wrap">
    <div class="joystick-ring">
      <div class="cross-h"></div>
      <div class="cross-v"></div>
      <span class="dir-label n">FWD</span>
      <span class="dir-label s">BWD</span>
      <span class="dir-label w">LEFT</span>
      <span class="dir-label e">RIGHT</span>
      <div id="zone"></div>
    </div>
  </div>

  <div class="metrics">
    <div class="metric-card">
      <div class="metric-label">Linear</div>
      <div class="metric-value" id="linVal">0.00<span>m/s</span></div>
      <div class="metric-bar"><div class="metric-fill" id="linBar"></div></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Angular</div>
      <div class="metric-value" id="angVal">0.00<span>r/s</span></div>
      <div class="metric-bar"><div class="metric-fill angular" id="angBar"></div></div>
    </div>
  </div>


  <div class="footer">MAX VEL 1.0 m/s · 1.5 rad/s · 20 Hz</div>

  <script>
    const MAX_LINEAR  = 1.0;
    const MAX_ANGULAR = 1.5;

    const connBar  = document.getElementById('connBar');
    const connText = document.getElementById('connText');
    const linVal   = document.getElementById('linVal');
    const angVal   = document.getElementById('angVal');
    const linBar   = document.getElementById('linBar');
    const angBar   = document.getElementById('angBar');

    let ws;

    function connect() {
      ws = new WebSocket("ws://192.168.1.11:8765");

   
      ws.onopen = () => {
        connBar.className = 'conn-bar connected';
        connText.textContent = 'Connected · ws://192.168.1.11:8765';
      };

   
      ws.onclose = () => {
        connBar.className = 'conn-bar';
        connText.textContent = 'Disconnected — retrying...';
        setTimeout(connect, 2000); 
      };
      ws.onerror = () => ws.close();
    }

    connect();

    const joystick = nipplejs.create({
      zone: document.getElementById('zone'),
      mode: 'static',
      position: { left: '50%', top: '50%' },
      color: '#00d4aa',
      size: 80
    });

    function updateMetrics(linear, angular) {
      linVal.innerHTML = Math.abs(linear).toFixed(2) + '<span>m/s</span>';
      angVal.innerHTML = Math.abs(angular).toFixed(2) + '<span>r/s</span>';
      linBar.style.width = (Math.abs(linear) / MAX_LINEAR * 100) + '%';
      angBar.style.width  = (Math.abs(angular) / MAX_ANGULAR * 100) + '%';
      linBar.style.background = linear < 0 ? '#f85149' : '#00d4aa';
    }

    joystick.on('move', (evt, data) => {
      const angle  = data.angle.radian;
      const force  = Math.min(data.force, 1.0);
      const linear  =  Math.sin(angle) * force * MAX_LINEAR;
      const angular = -Math.cos(angle) * force * MAX_ANGULAR;
      updateMetrics(linear, angular);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ linear, angular }));
      }
    });

    joystick.on('end', () => {
      updateMetrics(0, 0);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ linear: 0.0, angular: 0.0 }));
      }
    });
  </script>

</body>
</html>
